services:
  spectre:
    build:
      context: .
      target: runtime
      args:
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8765}
    env_file:
      - path: .env
        required: false
    ports:
      - "${WS_PORT:-8765}:8765"
      - "${SPECTRE_UI_PORT:-8080}:8080"
    volumes:
      - ./scopes:/app/scopes:ro
      - ./data/sessions:/app/data/sessions
      - ./reports:/app/reports
    environment:
      WS_HOST: "0.0.0.0"
      WS_PORT: "8765"
      SPECTRE_DATA_DIR: /app/data/sessions
      SCOPE_DIR: /app/scopes
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      SPECTRE_REPO: ${SPECTRE_REPO:-tmestery/SPECTRE}
      SPECTRE_SCOPE: ${SPECTRE_SCOPE:-scopes/spectre.yaml}
      SPECTRE_BRANCH: ${SPECTRE_BRANCH:-main}
      SPECTRE_UI_PORT: "8080"
    restart: "no"

  cli:
    build:
      context: .
      target: cli
    profiles:
      - cli
    env_file:
      - path: .env
        required: false
    volumes:
      - ./scopes:/app/scopes:ro
      - ./data/sessions:/app/data/sessions
      - ./reports:/app/reports
    environment:
      SPECTRE_DATA_DIR: /app/data/sessions
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
    entrypoint: ["python", "-m", "spectre.cli"]
