[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectre"
version = "0.1.0"
description = "Self-coordinating GitHub repo security audit crew"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
spectre = "spectre.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["spectre"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
packages = ["spectre"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
# Gradual typing — CI mypy job is non-blocking until the package is clean.
pretty = true
